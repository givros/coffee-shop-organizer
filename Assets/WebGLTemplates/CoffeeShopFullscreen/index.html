<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #080604;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080604;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #080604;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        background: #080604;
      }

      #unity-loading-screen {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(139, 54, 15, 0.18), transparent 42%),
          #080604;
        opacity: 1;
        visibility: visible;
        transition: opacity 300ms ease, visibility 300ms ease;
      }

      #unity-loading-screen.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loading-panel {
        width: min(420px, calc(100vw - 64px));
        text-align: center;
      }

      .loading-title {
        margin-bottom: 22px;
        color: #fff7e8;
        font-size: clamp(18px, 2vw, 26px);
        font-weight: 800;
        letter-spacing: 0.16em;
      }

      .loading-title span {
        display: block;
        margin-top: 6px;
        color: #dc650f;
        font-size: 0.5em;
        letter-spacing: 0.42em;
      }

      .progress-track {
        height: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 247, 232, 0.42);
        background: rgba(255, 255, 255, 0.08);
      }

      #unity-progress {
        width: 0%;
        height: 100%;
        background: #dc650f;
        transition: width 120ms linear;
      }

      #unity-loading-label {
        margin-top: 10px;
        color: rgba(255, 247, 232, 0.72);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      #unity-warning {
        position: fixed;
        top: 16px;
        left: 50%;
        z-index: 20;
        width: min(720px, calc(100vw - 32px));
        transform: translateX(-50%);
        color: #ffffff;
        font-size: 14px;
      }

      #unity-warning div {
        margin-bottom: 8px;
        padding: 12px 16px;
        border-left: 4px solid #dc650f;
        background: rgba(18, 12, 8, 0.94);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="0"></canvas>
      <div id="unity-loading-screen" role="status" aria-live="polite">
        <div class="loading-panel">
          <div class="loading-title">COFFEE SHOP<span>ORGANIZER</span></div>
          <div class="progress-track" aria-hidden="true">
            <div id="unity-progress"></div>
          </div>
          <div id="unity-loading-label">Loading 0%</div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </main>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingScreen = document.querySelector("#unity-loading-screen");
      const progressBar = document.querySelector("#unity-progress");
      const loadingLabel = document.querySelector("#unity-loading-label");
      const warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(message, type) {
        const banner = document.createElement("div");
        banner.textContent = message;
        if (type === "error") {
          banner.style.borderLeftColor = "#ff4d4d";
        }
        warningBanner.appendChild(banner);

        if (type !== "error") {
          window.setTimeout(() => banner.remove(), 5000);
        }
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif

      canvas.addEventListener("pointerdown", () => canvas.focus());
      canvas.addEventListener("contextmenu", (event) => event.preventDefault());

      const loaderScript = document.createElement("script");
      loaderScript.src = loaderUrl;
      loaderScript.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          const percentage = Math.round(progress * 100);
          progressBar.style.width = percentage + "%";
          loadingLabel.textContent = "Loading " + percentage + "%";
        }).then(() => {
          loadingScreen.classList.add("is-hidden");
          canvas.focus();
        }).catch((message) => {
          loadingLabel.textContent = "Unable to load the game";
          unityShowBanner(message, "error");
        });
      };
      loaderScript.onerror = () => {
        loadingLabel.textContent = "Unable to load the game";
        unityShowBanner("The game loader could not be downloaded.", "error");
      };

      document.body.appendChild(loaderScript);
    </script>
  </body>
</html>
